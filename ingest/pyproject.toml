[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-ingest"
version = "0.1.0"
description = "Portable first-party RSS news ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser==6.0.14",
  "httpx[http2]==0.28.1",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "selectolax==0.4.11",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "respx==0.23.1", "ruff==0.16.6"]

[project.scripts]
news-ingest = "news_ingest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: network-backed source contract tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
