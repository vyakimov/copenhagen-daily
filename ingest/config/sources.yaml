schema_version: 1
database_path: var/news-ingest.sqlite3
lock_path: var/news-ingest.lock
poll_interval_seconds: 300
homepage_poll_interval_seconds: 900
export_default_lookback_hours: 48
raw_payload_retention_days: null
max_response_bytes: 5242880
max_public_body_characters: 30000
failure_alert_threshold: 3
item_count_drop_warning_percent: 70
http:
  timeout_seconds: 15
  attempts: 3
  max_connections_per_host: 2
  user_agent: "VictorNewsCollector/1.0 (private personal use; contact configured locally)"
sources:
  nytimes:
    enabled: true
    identity: guid
    language: en
    merge_across_feeds: true
    fetch_article_pages: false
    fetch_public_body: false
    capture_homepage_placement: false
    feeds:
      - {id: nytimes.homepage, name: NYT Homepage, url: https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml, surface: homepage_rss, order: 0, description_priority: 10}
      - {id: nytimes.world, name: NYT World, url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml, surface: section_rss, order: 10, description_priority: 20}
      - {id: nytimes.europe, name: NYT Europe, url: https://rss.nytimes.com/services/xml/rss/nyt/Europe.xml, surface: section_rss, order: 20, description_priority: 20}
      - {id: nytimes.business, name: NYT Business, url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml, surface: section_rss, order: 30, description_priority: 20}
      - {id: nytimes.technology, name: NYT Technology, url: https://rss.nytimes.com/services/xml/rss/nyt/Technology.xml, surface: section_rss, order: 40, description_priority: 20}
      - {id: nytimes.science, name: NYT Science, url: https://rss.nytimes.com/services/xml/rss/nyt/Science.xml, surface: section_rss, order: 50, description_priority: 20}
