      - {id: nytimes.arts, name: NYT Arts, url: https://rss.nytimes.com/services/xml/rss/nyt/Arts.xml, surface: section_rss, order: 80, description_priority: 20}
      - {id: nytimes.books, name: NYT Books, url: https://rss.nytimes.com/services/xml/rss/nyt/Books.xml, surface: section_rss, order: 90, description_priority: 20}
      - {id: nytimes.opinion, name: NYT Opinion, url: https://rss.nytimes.com/services/xml/rss/nyt/Opinion.xml, surface: section_rss, order: 100, description_priority: 20}
