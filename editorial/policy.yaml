# Editorial policy for Copenhagen Daily.
#
# This is the masthead's standing line, written by the owner and versioned here. Block 2 reads it at
# every run. It is not a reader profile and nothing in it is inferred from behaviour. Numbers here are
# the tunables the architecture plan names; the desk handbook says how they are used, and the editor
# is trusted with everything the file does not settle.

title: copenhagen-daily
masthead: Copenhagen Daily
language: en
timezone: Europe/Copenhagen

schedule:
  edition: morning
  cutoff_local: "08:00"      # the edition covers news through this time; published shortly after
  candidate_window_hours: 72 # publication-time window; anything observed since the last edition also qualifies
  memory_editions: 14        # published editions read at each run for repeat suppression and threads
  thread_dormant_days: 14

# Danish outlets decide what is news. A story is eligible only if one of these reports it, and only
# these count towards breadth and prominence. Every other configured publisher is linked: attached as
# a source when it covers a story a scoring publisher reports, never scoring, never making eligible.
scoring_publishers: [dr, tv2, politiken, berlingske, jp, borsen, information, altinget, kristeligt_dagblad]

# Danish feeds that carry primary material rather than journalism: press releases and similar. They
# never make a story eligible and never score, but when a scoring publisher reports a story they
# also carry, their text is attached as evidence for the writer, the way a linked publisher's is.
corroborating_publishers: [via_ritzau]

# score = (0.45 breadth + 0.10 peak_prominence + 0.30 recency + 0.15 thread_strength) x section_weight
weights:
  breadth: 0.45
  peak_prominence: 0.10
  recency: 0.30
  thread_strength: 0.15

# The ratio between two weights is the margin a story needs to overcome them.
section_weights:
  denmark: 1.0
  politics: 1.0
  copenhagen: 0.9
  economy: 0.8
  education: 0.8
  justice: 0.8
  nordics: 0.8
  business: 0.7
  climate: 0.7
  europe: 0.7
  world: 0.7
  health: 0.6
  culture: 0.6
  science: 0.6
  technology: 0.5
  sport: 0.4

# Kickers are what the reader sees. Each section has a default; the editor may use a more specific
# kicker from the allowed list when it helps the reader, and never one outside it. "Opinion" is a
# secondary kicker, not a section.
kickers:
  denmark: [Denmark, Defence, Transport, Municipalities, Crime, Prices, History, Bornholm]
  copenhagen: [Copenhagen]
  politics: [Politics, Welfare]
  economy: [Economy, Prices, Markets]
  business: [Business]
  nordics: [Nordics]
  europe: [Europe]
  world: [World]
  culture: [Culture, Obituary]
  science: [Science, Environment]
  climate: [Climate, Environment, Energy]
  technology: [Technology]
  health: [Health]
  education: [Education]
  justice: [Justice, Crime]
  sport: [Sport]
  secondary_kickers: [Opinion, Analysis]

# Word budgets are ceilings, never targets. A thin story is a short story.
budgets:
  lead_words: [120, 180]
  secondary_words: [60, 110]
  brief_words: 35
  device_capacity:            # lead-wide, the composition block 3 has built; the required set must fit
    secondary: 3
    brief: 4

sources:
  max_per_story: 16
  one_article_per_publisher: true      # a second only when it carries distinct evidence the copy uses
  exclude_unless_sole_coverage: [live_blog, rolling_page, video_reel]

# Section resolution comes from feed provenance, never from a model. Each feed maps to the sections
# an article seen in it belongs to; an article keeps the set of every section it was seen in. Latest
# and homepage feeds carry no section. Two Børsen feeds map to nothing on purpose: breaking and
# longread describe urgency and format, not subject.
