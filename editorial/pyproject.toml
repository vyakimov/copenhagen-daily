[project]
name = "news-editorial"
version = "0.1.0"
description = "an LLM news editor turning RSS into copy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.26.0",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
  "rfc3339-validator==0.1.4",
]

[project.scripts]
news-editorial = "news_editorial:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.81.0",
  "ipython==9.17.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: network-backed source contract tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
