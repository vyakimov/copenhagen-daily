# Operational settings for the editorial desk runner. The editorial line is in policy.yaml; this file
# says where things are and which tools run the sessions.
publish_root: publisher/var/evaluation/site   # block 3's publish root; relative paths are from the repository root
checker: codex                                 # claude or codex; the brief is the same
editor_command: claude                         # the Claude Code binary
codex_command: codex
editor_model: claude-opus-5-5                            # null keeps the CLI's default
checker_model: null                            # null keeps the checker CLI's default
collect_before_export: true                    # poll block 1 once before exporting the window
commit_runs: true                              # git-commit the run directory after an activated publish

# Delivery to AWS. Leave bucket empty until the bucket and distribution exist; the run then skips it.
delivery:
  bucket: copenhagen-daily-live
  distribution_id: E67FD57M9R899
  profile: copenhagen-daily                    # an AWS CLI profile, or null for the default
  aws_command: aws

# How the owner hears about a failure. `command` gets the subject as its argument and the body on
# stdin. With no command, var/smtp.env (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM,
# MAIL_TO) sends an email; with neither, a desktop notification and a line on stderr.
notify:
  command: null

max_edition_age_hours: 30                      # freshness: older than this and the paper is stale
