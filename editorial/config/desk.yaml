# Operational settings for the editorial desk runner. The editorial line is in policy.yaml; this file
# says where things are and which tools run the sessions.
publish_root: publisher/var/evaluation/site   # block 3's publish root; relative paths are from the repository root
checker: codex                                 # claude or codex; the brief is the same
editor_command: claude                         # the Claude Code binary
codex_command: codex
editor_model: claude-opus-5-5                            # null keeps the CLI's default
checker_model: null                            # null keeps the checker CLI's default
collect_before_export: true                    # poll block 1 once before exporting the window
commit_runs: true                              # git-commit the run directory after an activated publish
device: true                                   # also render the kitchen screen's page; a device failure leaves the web edition untouched

# Where the device page goes after delivery: scp -O to host:path. The host is a ~/.ssh/config alias
# whose key passphrase lives in the login keychain. Leave host empty to skip the push.
device_push:
  host: MisterGentleman
  path: /volume1/web/todays_news.png

# Delivery to AWS. Leave bucket empty until the bucket and distribution exist; the run then skips it.
delivery:
  bucket: copenhagen-daily-live
  distribution_id: E67FD57M9R899
  profile: copenhagen-daily-deliver            # an IAM user scoped to this bucket and distribution; the SSO profile is for people
  aws_command: aws
  site_url: https://copenhagen-daily.net       # what readers open; verify-live checks it against the live tree

# How the owner hears about a failure, and gets the daily live-site verdict. `command` gets the
# subject as its argument and the body on stdin. With no command, var/discord.env (DISCORD_WEBHOOK_ID
# and DISCORD_WEBHOOK_TOKEN, or DISCORD_WEBHOOK_URL) posts to a Discord channel; failing that,
# var/smtp.env (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_FROM, MAIL_TO) sends an email;
# with none of them, a desktop notification and a line on stderr.
notify:
  command: null

max_edition_age_hours: 30                      # freshness: older than this and the paper is stale
